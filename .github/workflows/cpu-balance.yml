name: Tune CPU difficulty

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate without changing the game
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: cpu-balance
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate recent anonymous matches and feedback
        env:
          BALANCE_EXPORT_URL: https://infra-rush-numaters.fly.dev/balance/export
          BALANCE_EXPORT_TOKEN: ${{ secrets.BALANCE_EXPORT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run balance -- --dry-run
          else
            npm run balance
          fi
      - name: Check for a bounded model update
        id: change
        run: |
          if git diff --quiet -- master/cpu.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate candidate
        if: steps.change.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          npx eslint src tests
      - name: Commit audited model and publish
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'infra-rush-balance[bot]'
          git config user.email 'infra-rush-balance[bot]@users.noreply.github.com'
          git add master/cpu.json docs/balance/history.jsonl
          git commit -m 'Tune CPU difficulty from match feedback'
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
