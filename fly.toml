app = "infra-rush-numaters"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  INFRA_ALLOWED_ORIGINS = "https://infrarush.net,https://numaters.github.io"
  INFRA_FEEDBACK_PATH = "/data/feedback.jsonl"
  INFRA_MATCH_PATH = "/data/matches.jsonl"

[mounts]
  source = "feedback_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
