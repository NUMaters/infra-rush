<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#168cd0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="%BASE_URL%icons/favicon-48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%media/opening-gemini-77f0d820-hd-poster.webp"
    />
    <style>
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: linear-gradient(180deg, #d4f2f5, #6baed1 62%, #2676ac);
      }
      #opening-motion-fallback,
      #opening-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scale(1.28);
      }
      #opening-video {
        z-index: 1;
        opacity: 0;
      }
      #opening-video.opening-video-moving {
        opacity: 1;
      }
      #opening-video.opening-video-fallback {
        opacity: 0;
      }
      #loading .opening-tint {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(180deg, transparent 68%, #0a2b5566);
        pointer-events: none;
      }
      #opening-play {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 65%;
        transform: translate(-50%, -50%);
        min-height: 48px;
        padding: 9px 19px;
        border: 3px solid white;
        border-radius: 18px;
        background: #ffcf48;
        color: #244e68;
        font:
          900 16px system-ui,
          sans-serif;
        box-shadow: 0 4px 0 #b87825;
      }
      #opening-play[hidden] {
        display: none;
      }
      #opening-skip {
        position: absolute;
        z-index: 4;
        right: max(16px, env(safe-area-inset-right));
        top: max(20px, env(safe-area-inset-top));
        min-height: 44px;
        padding: 8px 14px;
        border: 2px solid #ffffffbb;
        border-radius: 14px;
        background: #174e7aaa;
        color: white;
        font:
          800 14px system-ui,
          sans-serif;
      }
      #opening-skip[hidden] {
        display: none;
      }
      #loading.opening-ready .opening-status {
        opacity: 0;
        pointer-events: none;
      }
      #loading .opening-status {
        position: absolute;
        z-index: 3;
        bottom: 5vh;
        left: 50%;
        width: min(310px, 68vw);
        transform: translateX(-50%);
        color: white;
        text-align: center;
      }
      #loading .opening-status p {
        margin: 8px 0;
        font:
          900 18px system-ui,
          sans-serif;
        text-shadow: 0 2px 12px #193551a6;
      }
      #loading .opening-progress {
        height: 9px;
        overflow: hidden;
        border: 2px solid white;
        border-radius: 20px;
        background: #ffffff66;
      }
      #loading .opening-progress span {
        display: block;
        width: 0;
        height: 100%;
        background: #ffd451;
      }
      #loading .loading-spinner {
        display: block;
        width: 28px;
        height: 28px;
        margin: auto;
        border: 5px solid #fff8;
        border-top-color: #ffd451;
        border-radius: 50%;
        animation: opening-spin 0.8s linear infinite;
      }
      @keyframes opening-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading {
          background: #d7f3f7
            url("%BASE_URL%media/opening-gemini-77f0d820-hd-poster.webp")
            center / contain no-repeat;
        }
        #opening-motion-fallback,
        #opening-video {
          display: none;
        }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="5体の作業Botと、勝利への道をつくろう。土木施工3Dストラテジー INFRA RUSH。"
    />
    <title>INFRA RUSH — 勝利への道をつくろう。</title>
  </head>
  <body>
    <div id="app">
      <section id="loading" aria-label="ゲームを読み込み中">
        <img
          id="opening-motion-fallback"
          src="%BASE_URL%media/opening-gemini-77f0d820-hd-poster.webp"
          alt=""
          aria-hidden="true"
        />
        <video
          id="opening-video"
          class="opening-video"
          poster="%BASE_URL%media/opening-gemini-77f0d820-hd-poster.webp"
          muted
          autoplay
          playsinline
          loop
          preload="metadata"
          aria-hidden="true"
        >
          <source
            media="(max-width: 700px)"
            src="%BASE_URL%media/opening-gemini-77f0d820-lite.mp4"
            type="video/mp4"
          />
          <source
            src="%BASE_URL%media/opening-gemini-77f0d820-hd.mp4"
            type="video/mp4"
          />
        </video>
        <div class="opening-tint" aria-hidden="true"></div>
        <button id="opening-play" type="button" hidden>▶ ムービーを再生</button>
        <button id="opening-skip" type="button" hidden>スキップ →</button>
        <div class="opening-status">
          <div
            class="match-spinner loading-spinner"
            role="progressbar"
            aria-label="読み込み中"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
          <p>読み込み中…</p>
          <div class="opening-progress" aria-hidden="true"><span></span></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
